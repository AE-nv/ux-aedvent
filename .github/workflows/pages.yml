name: Guard and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard published days
        run: node scripts/guard.mjs "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

  deploy:
    if: github.event_name != 'pull_request'
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (published output only)
        run: |
          mkdir _site
          cp -r index.html privacy.html manifest.json assets .nojekyll _site/
          [ -d day ] && cp -r day _site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
